<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tavsiyevar.net — Gerçek Deneyim ve Tavsiye Platformu</title>
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --emerald-primary: #059669;
      --emerald-dark: #047857;
      --emerald-soft: #ecfdf5;
      --emerald-border: #a7f3d0;
      --amber-primary: #d97706;
      --amber-bright: #f59e0b;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --border-light: #e2e8f0;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 4px 10px -2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 20px 35px -10px rgba(15, 23, 42, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Üst Menü Barı: Solda Marka, Sağda Sabit '+ Tavsiye Ekle' */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-light);
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: nowrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      min-width: 0;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }

    .brand-title {
      font-family: ui-rounded, "SF Pro Rounded", "Quicksand", "Nunito", system-ui, -apple-system, sans-serif;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #0e6167;
      white-space: nowrap;
      display: inline-flex;
      align-items: baseline;
    }

    .brand-title .brand-tld {
      color: #d97706;
    }

    /* Sağ üstteki tek '+' işaretli Tavsiye Ekle butonu */
    .btn-add-top {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--emerald-primary);
      color: #ffffff;
      border: none;
      border-radius: 11px;
      padding: 10px 16px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background-color 0.16s ease, transform 0.12s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-add-top:hover {
      background: var(--emerald-dark);
    }

    .btn-add-top:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #ffffff;
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
      border-radius: 11px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .btn-secondary:hover {
      background: var(--bg-subtle);
      color: var(--text-main);
    }

    /* Ana İçerik Alanı */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 16px 64px;
    }

    /* Alt Başlık / Değer Önerisi ve Tam Amblemli Rozet */
    .hero-banner {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .fp-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--emerald-soft);
      border: 1px solid var(--emerald-border);
      color: var(--emerald-dark);
      font-size: 12.5px;
      font-weight: 700;
    }

    .fp-badge-icon {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .hero-subtitle {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-secondary);
      max-width: 680px;
    }

    /* Kategori ve Arama Çubuğu */
    .filter-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 13px 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pills-scroll {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .pills-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      border: 1px solid var(--border-light);
      background: var(--bg-page);
      color: var(--text-secondary);
      padding: 7px 13px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .cat-btn:hover {
      border-color: var(--emerald-primary);
      color: var(--emerald-dark);
    }

    .cat-btn.active {
      background: var(--emerald-primary);
      border-color: var(--emerald-primary);
      color: #ffffff;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 230px;
      max-width: 340px;
    }

    .search-wrap svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-field {
      width: 100%;
      padding: 8.5px 12px 8.5px 34px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      background: var(--bg-page);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .search-field:focus {
      background: #ffffff;
      border-color: var(--emerald-primary);
    }

    /* Tavsiye Kartları Izgarası */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 768px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }
      .search-wrap {
        max-width: 100%;
        width: 100%;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-md);
    }

    .card-top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .meta-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill-cat {
      background: var(--emerald-soft);
      color: var(--emerald-dark);
      border: 1px solid var(--emerald-border);
      padding: 3px 9px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
    }

    .pill-time {
      background: var(--bg-page);
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
      padding: 3px 9px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
    }

    .score-summary {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-page);
      border: 1px solid var(--border-light);
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
    }

    .score-summary span.vote-count {
      font-weight: 500;
      color: var(--text-muted);
      font-size: 11px;
    }

    .product-title-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-bottom: 10px;
    }

    .title-emblem {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: var(--emerald-soft);
      border: 1px solid var(--emerald-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .product-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .product-note {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.58;
    }

    /* Kart İçi Fotoğraf & Video Önizlemeleri */
    .media-gallery {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
    }

    .media-thumb {
      position: relative;
      border-radius: 11px;
      overflow: hidden;
      border: 1px solid var(--border-light);
      background: var(--bg-page);
      height: 160px;
      cursor: pointer;
    }

    .media-thumb img,
    .media-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .media-zoom-hint {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(15, 23, 42, 0.72);
      color: #ffffff;
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      pointer-events: none;
    }

    /* Kart Altı 5 Kutucuklu Puanlama Alanı */
    .card-bottom {
      margin-top: 16px;
      padding-top: 13px;
      border-top: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .rating-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .rating-boxes {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* 28x28px Bağımsız Amblem Kutucukları */
    .vote-box {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: transform 0.14s ease, border-color 0.14s ease, background-color 0.14s ease, box-shadow 0.14s ease;
    }

    .vote-box:hover {
      transform: translateY(-1.5px);
      border-color: var(--emerald-primary);
    }

    .vote-box:active {
      transform: scale(0.92);
    }

    .vote-box.lit {
      background: var(--amber-soft);
      border-color: var(--amber-primary);
      box-shadow: 0 1px 4px rgba(217, 119, 6, 0.18);
    }

    .rating-caption {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      user-select: none;
    }

    .user-vote-pill {
      font-size: 12px;
      font-weight: 700;
      color: var(--emerald-dark);
      background: var(--emerald-soft);
      border: 1px solid var(--emerald-border);
      padding: 3px 9px;
      border-radius: 7px;
    }

    /* Boş Arama Durumu */
    .empty-box {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 36px 20px;
      text-align: center;
    }

    .empty-box h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .empty-box p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    /* Modal Penceresi */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 18px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-lg);
    }

    .modal-head {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #ffffff;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-head-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: 1px solid var(--border-light);
      background: var(--bg-page);
      color: var(--text-secondary);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      background: var(--bg-subtle);
      color: var(--text-main);
    }

    .modal-form {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 520px) {
      .grid-2col {
        grid-template-columns: 1fr;
      }
    }

    .field-block label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .input-ctrl {
      width: 100%;
      padding: 10px 12px;
      border-radius: 11px;
      border: 1px solid var(--border-light);
      background: var(--bg-page);
      color: var(--text-main);
      font-family: inherit;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .input-ctrl:focus {
      background: #ffffff;
      border-color: var(--emerald-primary);
    }

    textarea.input-ctrl {
      resize: vertical;
      min-height: 92px;
    }

    /* Fotoğraf / Video Yükleme Kutusu */
    .media-drop {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 16px;
      border-radius: 12px;
      border: 2px dashed #cbd5e1;
      background: var(--bg-page);
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .media-drop:hover {
      border-color: var(--emerald-primary);
      background: var(--emerald-soft);
    }

    .media-drop-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      color: var(--emerald-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-drop-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .media-drop-sub {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .upload-preview-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .upload-item {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-light);
      background: #ffffff;
    }

    .upload-item img,
    .upload-item video {
      width: 100%;
      height: 80px;
      object-fit: cover;
      display: block;
      background: #0f172a;
    }

    .remove-media-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: none;
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .remove-media-btn:hover {
      background: #dc2626;
    }

    .upload-item-name {
      font-size: 10.5px;
      color: var(--text-secondary);
      padding: 4px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid var(--border-light);
    }

    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }

    /* Tam Ekran Medya Lightbox */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      z-index: 65;
      background: rgba(15, 23, 42, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox-overlay.open {
      display: flex;
    }

    .lightbox-inner {
      position: relative;
      max-width: 90vw;
      max-height: 88vh;
      border-radius: 14px;
      overflow: hidden;
      background: #0f172a;
      box-shadow: var(--shadow-lg);
    }

    .lightbox-inner img,
    .lightbox-inner video {
      display: block;
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: none;
      background: rgba(15, 23, 42, 0.82);
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    /* Bildirim Çubuğu */
    .toast-msg {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 70;
      background: #0f172a;
      color: #ffffff;
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast-msg.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-indicator {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--amber-bright);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Üst Menü Barı: Solda Logo + tavsiyevar.net, Sağda Tek '+ Tavsiye Ekle' Butonu -->
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#top" class="brand" onclick="resetAllFilters(event)">
        <span class="brand-mark" aria-hidden="true">
          <!-- Gönderilen Görselle Birebir Uyumlu Fasetli Petrol Yıldız + Altın 3B Yükseliş Oku Amblemi -->
          <svg width="28" height="28" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Sol Petrol / Camgöbeği Yıldız Yarısı (Fasetli) -->
            <polygon points="50,12 50,50 41,38" fill="#09484d" />
            <polygon points="41,38 50,50 14,38" fill="#178288" />
            <polygon points="14,38 50,50 36,60" fill="#0e6167" />
            <polygon points="36,60 50,50 28,88" fill="#157a80" />
            <polygon points="28,88 50,50 50,71" fill="#09484d" />
            <!-- Sağ Alt Altın / Hardal Yıldız Kolu (Fasetli) -->
            <polygon points="50,12 59,38 50,50" fill="#d4a74a" />
            <polygon points="50,71 50,50 72,88" fill="#c89b43" />
            <polygon points="72,88 50,50 64,60" fill="#b38530" />
            <!-- Sağ Üst Koldan Yükselen 3B Çift Renkli Ok (Altın Ön Yüz + Petrol Alt/Sağ Kalınlık) -->
            <polygon points="58,60 66,60 85,39 85,46 92,46 92,23 85,23 64,53" fill="#0e6167" />
            <polygon points="50,50 58,50 75,30 68,23 92,23 85,39 79,34 62,55 50,55" fill="#cfa349" />
            <polygon points="68,23 92,23 75,30" fill="#deb358" />
          </svg>
        </span>
        <span class="brand-title">tavsiyevar<span class="brand-tld">.net</span></span>
      </a>

      {

        note: 'Çorba, sos ve günlük mutfak hazırlıklarında büyük robotu çıkarmaya gerek bırakmadan tencere başında hızlıca iş görüyor. Parçalarının kolay temizlenmesi günlük kullanımı teşvik ediyor.',
        media: [],

        ratingSum: 178,
        ratingCount: 39
      },
      {
        id: 'rec-10',
        product: 'TP-Link Deco X50 AX3000 (Wi-Fi 6 Mesh Sistemi)',
        category: 'Bilgisayar & Aksesuar',
        duration: '8 aydır kullanımda',
        note: 'Evin arka odalarında yaşanan Wi-Fi kopmalarını ve sinyal düşüşünü tamamen ortadan kaldırdı. Odalar arasında gezerken ağ değiştirmeye gerek kalmadan kesintisiz hız sunuyor.',
        media: [],
        userRating: 0,
        ratingSum: 215,
        ratingCount: 45
      }
    ];

    let recommendations = loadRecommendations();
    let selectedCategory = 'Tümü';
    let searchTerm = '';
    let stagedMedia = [];

    function loadRecommendations() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed;
          }
        }
      } catch (err) {
        console.warn('localStorage okuma uyarısı:', err);
      }
      saveRecommendations(INITIAL_ITEMS);
      return JSON.parse(JSON.stringify(INITIAL_ITEMS));
    }

    function saveRecommendations(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (err) {
        console.warn('localStorage yazma uyarısı:', err);
        showToast('Büyük medya dosyası bu oturumda geçici olarak gösteriliyor');
      }
    }

    /**
     * Gönderilen Görselle Birebir Uyumlu Fasetli Petrol Yıldız + Altın 3B Yükseliş Oku Amblemi
     */
    function buildEmblemSVG(lit, size = 18) {
      if (lit) {
        return `
          <svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <polygon points="50,12 50,50 41,38" fill="#09484d" />
            <polygon points="41,38 50,50 14,38" fill="#178288" />
            <polygon points="14,38 50,50 36,60" fill="#0e6167" />
            <polygon points="36,60 50,50 28,88" fill="#157a80" />
            <polygon points="28,88 50,50 50,71" fill="#09484d" />
            <polygon points="50,12 59,38 50,50" fill="#d4a74a" />
            <polygon points="50,71 50,50 72,88" fill="#c89b43" />
            <polygon points="72,88 50,50 64,60" fill="#b38530" />
            <polygon points="58,60 66,60 85,39 85,46 92,46 92,23 85,23 64,53" fill="#0e6167" />
            <polygon points="50,50 58,50 75,30 68,23 92,23 85,39 79,34 62,55 50,55" fill="#cfa349" />
            <polygon points="68,23 92,23 75,30" fill="#deb358" />
          </svg>
        `;
      }
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <polygon points="50,12 50,50 41,38" fill="#64748b" />
          <polygon points="41,38 50,50 14,38" fill="#cbd5e1" />
          <polygon points="14,38 50,50 36,60" fill="#94a3b8" />
          <polygon points="36,60 50,50 28,88" fill="#cbd5e1" />
          <polygon points="28,88 50,50 50,71" fill="#64748b" />
          <polygon points="50,12 59,38 50,50" fill="#e2e8f0" />
          <polygon points="50,71 50,50 72,88" fill="#cbd5e1" />
          <polygon points="72,88 50,50 64,60" fill="#94a3b8" />
          <polygon points="58,60 66,60 85,39 85,46 92,46 92,23 85,23 64,53" fill="#94a3b8" />
          <polygon points="50,50 58,50 75,30 68,23 92,23 85,39 79,34 62,55 50,55" fill="#e2e8f0" />
          <polygon points="68,23 92,23 75,30" fill="#f1f5f9" />
        </svg>
      `;
    }

    function escapeText(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderMediaGallery(item) {
      if (!Array.isArray(item.media) || item.media.length === 0) return '';
      const thumbs = item.media
        .map((m, idx) => {
          if (m.type === 'video') {
            return `
              <div class="media-thumb" onclick="openLightbox('${item.id}', ${idx})">
                <video muted playsinline preload="metadata" src="${m.url}"></video>
                <span class="media-zoom-hint">Video</span>
              </div>
            `;
          }
          return `
            <div class="media-thumb" onclick="openLightbox('${item.id}', ${idx})">
              <img src="${m.url}" alt="${escapeText(item.product)}" onerror="this.parentElement.style.display='none'" />
              <span class="media-zoom-hint">Büyüt</span>
            </div>
          `;
        })
        .join('');
      return `<div class="media-gallery">${thumbs}</div>`;
    }

    function renderGrid() {
      const grid = document.getElementById('recommendationsGrid');
      const noResults = document.getElementById('noResultsBox');

      const filtered = recommendations.filter((item) => {
        const catOk = selectedCategory === 'Tümü' || item.category === selectedCategory;
        const q = searchTerm.trim().toLowerCase();
        const queryOk =
          !q ||
          item.product.toLowerCase().includes(q) ||
          item.note.toLowerCase().includes(q) ||
          item.category.toLowerCase().includes(q);
        return catOk && queryOk;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        noResults.classList.remove('hidden');
        return;
      }

      noResults.classList.add('hidden');

      grid.innerHTML = filtered
        .map((item) => {
          const avg = item.ratingCount > 0 ? (item.ratingSum / item.ratingCount).toFixed(1) : '0.0';
          const litCount = item.userRating || 0;

          let voteBoxes = '';
          for (let score = 1; score <= 5; score++) {
            const isLit = score <= litCount;
            voteBoxes += `
              <button
                type="button"
                class="vote-box ${isLit ? 'lit' : ''}"
                data-score="${score}"
                onclick="handleVote('${item.id}', ${score})"
                onmouseenter="handleHoverIn('${item.id}', ${score})"
                onmouseleave="handleHoverOut('${item.id}')"
                aria-label="${score} puan ver"
                title="${score} / 5"
              >
                ${buildEmblemSVG(isLit, 16)}
              </button>
            `;
          }

          return `
            <article class="card">
              <div>
                <div class="card-top-meta">
                  <div class="meta-badges">
                    <span class="pill-cat">${escapeText(item.category)}</span>
                    <span class="pill-time">${escapeText(item.duration)}</span>
                  </div>
                  <div class="score-summary" title="Topluluk ortalama puanı">
                    ${buildEmblemSVG(true, 14)}
                    <span>${avg}</span>
                    <span class="vote-count">(${item.ratingCount} oy)</span>
                  </div>
                </div>

                <div class="product-title-row">
                  <span class="title-emblem" aria-hidden="true">
                    ${buildEmblemSVG(true, 14)}
                  </span>
                  <h2 class="product-name">${escapeText(item.product)}</h2>
                </div>

                <p class="product-note">${escapeText(item.note)}</p>

                ${renderMediaGallery(item)}
              </div>

              <div class="card-bottom">
                <div class="rating-group">
                  <div class="rating-boxes" id="rating-row-${item.id}">
                    ${voteBoxes}
                  </div>
                  <span class="rating-caption">1-5 arası puanla</span>
                </div>

                <span class="user-vote-pill">
                  ${litCount > 0 ? `Puanın: ${litCount}/5` : `${avg} / 5`}
                </span>
              </div>
            </article>
          `;
        })
        .join('');
    }

    function handleHoverIn(itemId, hoverVal) {
      const row = document.getElementById(`rating-row-${itemId}`);
      if (!row) return;
      row.querySelectorAll('.vote-box').forEach((btn) => {
        const val = Number(btn.getAttribute('data-score'));
        const lit = val <= hoverVal;
        btn.classList.toggle('lit', lit);
        btn.innerHTML = buildEmblemSVG(lit, 16);
      });
    }

    function handleHoverOut(itemId) {
      const found = recommendations.find((r) => r.id === itemId);
      const row = document.getElementById(`rating-row-${itemId}`);
      if (!found || !row) return;
      const activeVal = found.userRating || 0;
      row.querySelectorAll('.vote-box').forEach((btn) => {
        const val = Number(btn.getAttribute('data-score'));
        const lit = val <= activeVal;
        btn.classList.toggle('lit', lit);
        btn.innerHTML = buildEmblemSVG(lit, 16);
      });
    }

    function handleVote(itemId, score) {
      const found = recommendations.find((r) => r.id === itemId);
      if (!found) return;

      if (!found.userRating || found.userRating === 0) {
        found.ratingSum += score;
        found.ratingCount += 1;
      } else {
        found.ratingSum = found.ratingSum - found.userRating + score;
      }
      found.userRating = score;

      saveRecommendations(recommendations);
      renderGrid();
      showToast(`${score}/5 puanın kaydedildi`);
    }

    // Kategori Seçimi
    document.getElementById('categoryTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.cat-btn');
      if (!btn) return;
      selectedCategory = btn.getAttribute('data-category');
      document.querySelectorAll('.cat-btn').forEach((el) => {
        el.classList.toggle('active', el === btn);
      });
      renderGrid();
    });

    // Arama Filtresi
    document.getElementById('searchBox').addEventListener('input', (e) => {
      searchTerm = e.target.value;
      renderGrid();
    });

    function resetAllFilters(e) {
      if (e) e.preventDefault();
      selectedCategory = 'Tümü';
      searchTerm = '';
      document.getElementById('searchBox').value = '';
      document.querySelectorAll('.cat-btn').forEach((el) => {
        el.classList.toggle('active', el.getAttribute('data-category') === 'Tümü');
      });
      renderGrid();
    }

    // Modal Aç / Kapat
    function openAddModal() {
      document.getElementById('addModalOverlay').classList.add('open');
      document.getElementById('inputProduct').focus();
    }

    function closeAddModal() {
      document.getElementById('addModalOverlay').classList.remove('open');
    }

    document.getElementById('addModalOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'addModalOverlay') {
        closeAddModal();
      }
    });

    // Fotoğraf ve Video Yükleme
    document.getElementById('inputMedia').addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      if (files.length === 0) return;

      files.forEach((file) => {
        const isImage = file.type.startsWith('image/');
        const isVideo = file.type.startsWith('video/');
        if (!isImage && !isVideo) return;

        const mediaId = 'med-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);

        if (isImage && file.size <= 1.8 * 1024 * 1024) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            stagedMedia.push({
              id: mediaId,
              type: 'image',
              url: ev.target.result,
              name: file.name
            });
            renderStagedMedia();
          };
          reader.readAsDataURL(file);
        } else {
          const objUrl = URL.createObjectURL(file);
          stagedMedia.push({
            id: mediaId,
            type: isImage ? 'image' : 'video',
            url: objUrl,
            name: file.name
          });
          renderStagedMedia();
        }
      });

      e.target.value = '';
    });

    function renderStagedMedia() {
      const container = document.getElementById('uploadPreviewList');
      if (stagedMedia.length === 0) {
        container.classList.add('hidden');
        container.innerHTML = '';
        return;
      }

      container.classList.remove('hidden');
      container.innerHTML = stagedMedia
        .map((m) => {
          const mediaEl =
            m.type === 'video'
              ? `<video src="${m.url}" muted playsinline></video>`
              : `<img src="${m.url}" alt="${escapeText(m.name)}" />`;
          return `
            <div class="upload-item">
              ${mediaEl}
              <button type="button" class="remove-media-btn" onclick="removeStagedMedia('${m.id}')" aria-label="Kaldır">&times;</button>
              <div class="upload-item-name">${escapeText(m.name)}</div>
            </div>
          `;
        })
        .join('');
    }

    function removeStagedMedia(mediaId) {
      const item = stagedMedia.find((m) => m.id === mediaId);
      if (item && item.url && item.url.startsWith('blob:')) {
        URL.revokeObjectURL(item.url);
      }
      stagedMedia = stagedMedia.filter((m) => m.id !== mediaId);
      renderStagedMedia();
    }

    // Yeni Tavsiye Kaydetme
    document.getElementById('newRecForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const product = document.getElementById('inputProduct').value.trim();
      const category = document.getElementById('inputCategory').value;
      const rawDuration = document.getElementById('inputDuration').value.trim();
      const note = document.getElementById('inputNote').value.trim();

      if (!product || !rawDuration || !note) {
        showToast('Lütfen zorunlu alanları doldurun');
        return;
      }

      const durationText = rawDuration.toLowerCase().includes('kullanım')
        ? rawDuration
        : `${rawDuration} kullanımda`;

      const created = {
        id: 'rec-' + Date.now(),
        product,
        category,
        duration: durationText,
        note,
        media: [...stagedMedia],
        userRating: 0,
        ratingSum: 5,
        ratingCount: 1
      };

      recommendations.unshift(created);
      saveRecommendations(recommendations);

      document.getElementById('newRecForm').reset();
      stagedMedia = [];
      renderStagedMedia();
      closeAddModal();
      renderGrid();
      showToast('Tavsiyen başarıyla yayınlandı');
    });

    // Medya Büyütme (Lightbox)
    function openLightbox(itemId, mediaIdx) {
      const item = recommendations.find((r) => r.id === itemId);
      if (!item || !item.media || !item.media[mediaIdx]) return;
      const media = item.media[mediaIdx];
      const box = document.getElementById('lightboxContent');

      if (media.type === 'video') {
        box.innerHTML = `<video src="${media.url}" controls autoplay playsinline></video>`;
      } else {
        box.innerHTML = `<img src="${media.url}" alt="${escapeText(item.product)}" />`;
      }

      document.getElementById('mediaLightbox').classList.add('open');
    }

    function closeLightbox(e) {
      if (e.target.id === 'mediaLightbox' || e.target.classList.contains('lightbox-close')) {
        document.getElementById('mediaLightbox').classList.remove('open');
        document.getElementById('lightboxContent').innerHTML = '';
      }
    }

    // Bildirim Çubuğu
    let toastTimeout = null;
    function showToast(text) {
      const banner = document.getElementById('toastBanner');
      document.getElementById('toastMessage').textContent = text;
      banner.classList.add('visible');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        banner.classList.remove('visible');
      }, 2400);
    }

    renderGrid();
  </script>
</body>
</html>
